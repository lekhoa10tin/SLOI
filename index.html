<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SLOI - Luyện thuật toán C++ HSGQG</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1c2033;--mut:#6b7190;--ac:#5b5bf0;--ok:#16a34a;--bad:#dc2626;--code:#101426}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c30;--tx:#e8eaf6;--mut:#9aa0c3;--ac:#8b8bff;--code:#0a0d1a}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c30;--tx:#e8eaf6;--mut:#9aa0c3;--ac:#8b8bff;--code:#0a0d1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 16px 8px;text-align:center}
h1{margin:0;font-size:2.2rem;letter-spacing:.2em;color:var(--ac)}
header p{margin:2px 0 0;color:var(--mut);font-size:.9rem}
nav{display:flex;gap:8px;justify-content:center;padding:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 16px;background:var(--ac);color:#fff;font-weight:600}
button:disabled{opacity:.5}button.sec{background:var(--card);color:var(--tx);border:1px solid var(--mut)}
main{max-width:820px;margin:0 auto;padding:8px 14px 60px}
.card{background:var(--card);border-radius:14px;padding:16px 18px;margin:14px 0;box-shadow:0 2px 10px #0002}
h2,h3{margin:.2em 0 .4em}
pre{background:var(--code);color:#d6deff;padding:12px;border-radius:10px;overflow-x:auto;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
textarea{width:100%;min-height:260px;background:var(--code);color:#d6deff;border:1px solid var(--mut);border-radius:10px;padding:12px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.timer{font:700 1.6rem ui-monospace,monospace;color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);word-break:break-word}
.mut{color:var(--mut);font-size:.9rem}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid #8883;text-align:left}
.fx{position:fixed;top:-40px;font-size:28px;pointer-events:none;z-index:99;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(400deg);opacity:.3}}
.ans{width:100%;padding:10px;border-radius:10px;border:2px solid var(--mut);background:var(--card);color:var(--tx);font:15px ui-monospace,Menlo,Consolas,monospace}
/* --- CSS CHO MÀN HÌNH CHÀO MỪNG --- */
.hero-section {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem 1rem;
    background: linear-gradient(135deg, rgba(91, 91, 240, 0.08) 0%, rgba(139, 139, 255, 0.08) 100%);
    border-bottom: 1px solid rgba(107, 113, 144, 0.2);
}
.hero-content { max-width: 800px; margin: 0 auto; }
.hero-badge {
    display: inline-block;
    padding: 0.35rem 1rem;
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ac);
    background: rgba(91, 91, 240, 0.12);
    border-radius: 50px;
    margin-bottom: 1.25rem;
}
.hero-title {
    font-size: clamp(2.3rem, 5vw, 3.8rem);
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 1.25rem;
    color: var(--tx);
}
.hero-title .highlight {
    background: linear-gradient(to right, var(--ac), #8b8bff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.hero-description {
    font-size: 1.05rem;
    line-height: 1.6;
    color: var(--mut);
    margin-bottom: 2rem;
}
.hero-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
.btn-start {
    background: var(--ac);
    color: white;
    font-weight: 600;
    padding: 0.85rem 2rem;
    font-size: 1rem;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 10px 20px -5px rgba(91, 91, 240, 0.4);
    transition: transform 0.2s ease, opacity 0.2s ease;
}
.btn-start:hover { transform: translateY(-2px); opacity: 0.95; }D
.det{background:rgba(91,91,240,.09);border-left:4px solid var(--ac);padding:10px 14px;border-radius:8px;margin:10px 0;font-size:.95rem}
.prob{background:rgba(22,163,74,.1);border-left:4px solid var(--ok);padding:12px 14px;border-radius:8px;margin:12px 0 4px;font-size:.97rem}
.prob b{color:var(--ok);display:block;margin-bottom:2px;letter-spacing:.02em}
.det p{margin:.4em 0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--bg);border:1px solid #8884;border-radius:50px;padding:2px 10px;font:13px ui-monospace,Menlo,Consolas,monospace}
.lg{display:inline-flex;align-items:center;gap:5px;margin-right:12px}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
#cv{width:100%;display:block;border-radius:10px;background:var(--bg);margin-top:10px}
.tag{display:inline-block;background:var(--ac);color:#fff;border-radius:50px;padding:2px 12px;font-size:.8rem;font-weight:700}
</style>
</head>
<body>
<!-- MÀN HÌNH CHÀO MỪNG -->
<section class="hero-section">
    <div class="hero-content">
        <span class="hero-badge">Cổng luyện thi HSG Tin học</span>
        <h1 class="hero-title">Xin chào đã đến với <span class="highlight">SLOI</span></h1>
        <p class="hero-description">
            Nền tảng trực tuyến chuyên sâu giúp bạn chinh phục các thuật toán C++ nâng cao, luyện tập bài bản từ cơ bản đến đỉnh cao để sẵn sàng bước vào kỳ thi HSGQG.
        </p>
        <div class="hero-actions">
            <button class="btn-start" onclick="startExploring()">🚀 Bắt đầu ngay</button>
        </div>
    </div>
</section>
<header><h1>SLOI</h1><p>Học thuật toán · Luyện code C++ · Chinh phục HSGQG</p></header>
<nav><button id="b1">📚 Lý thuyết</button><button id="b2" class="sec">🎮 Trò chơi</button><button id="b3" class="sec">🎬 Mô phỏng</button></nav>
<main id="app"></main>

<script src="sloi.js"></script>
</body>
</html>
